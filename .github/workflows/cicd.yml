name: test workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installation de Bandit
        run: pip install bandit

      - name: Scan Bandit (échoue si sévérité Medium ou High)
        run: bandit -r . -ll -x './.venv,./__pycache__,./.github'
  
  dast-setup:
    name: DAST - Démarrage de l'API
    runs-on: ubuntu-latest
    needs: sast-bandit

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Démarrage de l'API en arrière-plan
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &

      - name: Attente que l'API soit disponible
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/docs > /dev/null; then
              echo "API disponible."
              exit 0
            fi
            echo "En attente de l'API... ($i)"
            sleep 2
          done
          echo "L'API n'a pas démarré à temps."
          cat uvicorn.log
          exit 1
